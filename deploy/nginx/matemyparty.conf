map $http_upgrade $matemyparty_connection_upgrade {
    default upgrade;
    '' close;
}

# Invitation tokens are path credentials and must never be written to access logs.
map $request_uri $matemyparty_access_loggable {
    default 1;
    ~^/i/ 0;
    ~^/private-media/ 0;
}

proxy_headers_hash_max_size 1024;
proxy_headers_hash_bucket_size 128;

upstream matemyparty_web {
    # Port 3000 belongs to an unrelated VPS application.
    server 127.0.0.1:3200;
    keepalive 32;
}

upstream matemyparty_api {
    server 127.0.0.1:3201;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name matemyparty.domoforge.com raymundo6th.domoforge.com;
    access_log /var/log/nginx/matemyparty.access.log combined if=$matemyparty_access_loggable;
    error_log /var/log/nginx/matemyparty.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location ~ ^/(?:i|private-media)/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header Cache-Control "private, no-store, max-age=0" always;
        return 301 https://$host$request_uri;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name matemyparty.domoforge.com raymundo6th.domoforge.com;
    server_tokens off;
    access_log /var/log/nginx/matemyparty.access.log combined if=$matemyparty_access_loggable;
    error_log /var/log/nginx/matemyparty.error.log warn;

    ssl_certificate /etc/letsencrypt/live/matemyparty.domoforge.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matemyparty.domoforge.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MateMyPartyTLS:10m;
    ssl_session_timeout 1d;

    # Enable only after both hostnames have served stable HTTPS without rollback risk.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain;

    client_max_body_size 2m;
    large_client_header_buffers 4 16k;

    location = /health {
        proxy_pass http://matemyparty_api;
        include proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://matemyparty_api;
        include proxy_params;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Reserved for a future API websocket endpoint.
    location /ws/ {
        proxy_pass http://matemyparty_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $matemyparty_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    location ^~ /i/ {
        proxy_pass http://matemyparty_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location ^~ /private-media/raymundo-6/ {
        alias /forge/matemyparty-private-media/raymundo-6/;
        autoindex off;
        access_log off;
        log_not_found off;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location ^~ /private-media/ {
        access_log off;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header Cache-Control "private, no-store, max-age=0" always;
        return 404;
    }

    location ^~ /host/ {
        proxy_pass http://matemyparty_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location ^~ /internal/ {
        proxy_pass http://matemyparty_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location / {
        proxy_pass http://matemyparty_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $matemyparty_connection_upgrade;
        proxy_read_timeout 60s;
    }
}
