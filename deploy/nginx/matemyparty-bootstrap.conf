map $request_uri $matemyparty_access_loggable {
    default 1;
    ~^/i/ 0;
}

upstream matemyparty_web_bootstrap {
    server 127.0.0.1:3200;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name matemyparty.domoforge.com raymundo6th.domoforge.com;
    access_log /var/log/nginx/matemyparty.access.log combined if=$matemyparty_access_loggable;
    error_log /var/log/nginx/matemyparty.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        proxy_pass http://matemyparty_web_bootstrap;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
