services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: matemyparty
      POSTGRES_USER: matemyparty
      POSTGRES_PASSWORD: matemyparty
    ports:
      - '5432:5432'
    volumes:
      - matemyparty_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U matemyparty -d matemyparty']
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DATABASE_URL: postgresql://matemyparty:matemyparty@postgres:5432/matemyparty
      APP_VERSION: ${APP_VERSION:-0.1.0}
      HOST_ADMIN_TOKEN: ${HOST_ADMIN_TOKEN:?Set HOST_ADMIN_TOKEN in .env}
      PUBLIC_APP_PROTOCOL: ${PUBLIC_APP_PROTOCOL:-http}
      PRIMARY_APP_HOSTNAME: ${PRIMARY_APP_HOSTNAME:-localhost:3000}
    ports:
      - '${API_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "pnpm db:migrate && pnpm db:seed && pnpm --filter @matemyparty/api start"
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      NODE_ENV: production
      WEB_HOST: 0.0.0.0
      WEB_PORT: 3000
      INTERNAL_API_BASE_URL: http://api:3001
      PRIMARY_APP_HOSTNAME: ${PRIMARY_APP_HOSTNAME:-localhost:3000}
      HOST_ADMIN_TOKEN: ${HOST_ADMIN_TOKEN:?Set HOST_ADMIN_TOKEN in .env}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  matemyparty_postgres_data:
